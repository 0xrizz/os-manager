[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "0xrizz-os-manager"
version = "1.0.0"
description = "Autonomous governance harness and control plane for Claude Code"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "0xrizz", email = "abdulmajidalkarim343@gmail.com" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "bashlex>=0.18",
]

[project.urls]
Homepage = "https://github.com/0xrizz/os-manager"
Repository = "https://github.com/0xrizz/os-manager"
Issues = "https://github.com/0xrizz/os-manager/issues"

[project.scripts]
osm = "os_manager.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["os_manager"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E402", "E501"]


